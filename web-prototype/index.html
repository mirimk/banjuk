<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>반죽이의 하루</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2a1a;--cream:#fff7ea;--brown:#8a5a2b;--dark:#5a3a1e;--accent:#e07b39;--green:#5aa469;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#1d150f;overflow:hidden;font-family:'Gowun Dodum','Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
h1,h2,h3,.btn,.clock,.dname{font-family:'Jua','Malgun Gothic',sans-serif;font-weight:400}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1280px;height:720px;flex:none;overflow:hidden;background:#2a1d14;transform-origin:center center}
#screen{position:absolute;inset:0}
.emoji{font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;cursor:pointer;background:var(--accent);color:#fff;font-size:20px;padding:10px 20px;border-radius:14px;box-shadow:0 4px 0 #a5521f;transition:transform .08s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a5521f}
.btn.big{font-size:28px;padding:14px 0;width:280px}
.btn.small{font-size:17px;padding:8px 14px}
.btn.ghost{background:#fff3df;color:var(--dark);box-shadow:0 4px 0 #c9a77c}
.btn.disabled,.btn:disabled{background:#b9ab9a;color:#eee5d8;box-shadow:0 4px 0 #8f8270;cursor:not-allowed;filter:none}
.btn small{font-size:14px;opacity:.85}
.btn.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;top:0;right:0;height:64px;display:none;align-items:center;justify-content:space-between;padding:0 80px 0 14px;background:rgba(40,26,14,.82);color:#fff7ea;z-index:30}
.hud-left{display:flex;align-items:center;gap:12px}
.bars{display:flex;gap:14px}
.bar{width:120px;font-size:13px}
.bar .bt{display:flex;justify-content:space-between}
.bar .bb{height:9px;background:rgba(255,255,255,.18);border-radius:6px;overflow:hidden;margin-top:3px}
.bar .bb div{height:100%;border-radius:6px}
.hud-mid{display:flex;align-items:baseline;gap:12px;font-size:18px}
.hud-mid b{font-family:'Jua';font-size:22px;font-weight:400}
.clock{font-size:30px;color:#ffd58a}
.phase{background:rgba(255,255,255,.12);padding:3px 10px;border-radius:10px;font-size:15px}
.hud-right{font-family:'Jua';font-size:22px;display:flex;gap:16px;align-items:center}
.loc{font-size:15px;opacity:.85;font-family:'Gowun Dodum'}
#gear{position:absolute;top:9px;right:12px;width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;background:#fff3df;font-size:26px;z-index:60;box-shadow:0 3px 0 #c9a77c;display:flex;align-items:center;justify-content:center}
#gear:hover{transform:rotate(30deg)}

/* ---------- dough avatar ---------- */
.dough{position:relative;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;box-shadow:inset -6px -8px 0 rgba(0,0,0,.08),0 4px 10px rgba(0,0,0,.25);flex:none}
.dough svg{width:100%;height:100%;display:block}

/* ---------- title ---------- */
.title-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#ffe3b3,#e9a45f 60%,#9a5a2a);overflow:hidden}
.floaty{position:absolute;font-size:46px;opacity:.35;animation:floaty 9s linear infinite}
@keyframes floaty{from{transform:translateY(780px) rotate(0)}to{transform:translateY(-120px) rotate(360deg)}}
.title-box{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.title-box h1{font-size:96px;color:#5a2f12;text-shadow:0 5px 0 #fff3df,0 10px 20px rgba(0,0,0,.25);letter-spacing:4px}
.subtitle{font-size:24px;color:#6b3d1c;margin-bottom:22px}
.menu{display:flex;flex-direction:column;gap:16px}
.mascot{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) scaleX(1.04)}}
.ver{position:absolute;bottom:12px;right:16px;color:#5a2f12;opacity:.6;font-size:14px}

/* ---------- generic scene pieces ---------- */
.bg{position:absolute;inset:0}
.label{position:absolute;background:var(--dark);color:#fff;font-family:'Jua';font-size:18px;padding:3px 12px;border-radius:10px;white-space:nowrap}
.gauge{position:relative;height:10px;background:rgba(0,0,0,.25);border-radius:6px;overflow:hidden}
.gauge .band{position:absolute;top:0;bottom:0;background:rgba(120,220,120,.65)}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;background:#fff;opacity:.85;border-right:3px solid #e33}
.bottombar{position:absolute;left:0;right:0;bottom:0;height:70px;background:rgba(40,26,14,.85);display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#fff7ea;z-index:20}
.bottombar .tip{font-size:17px}
.bb-btns{display:flex;gap:10px;align-items:center}
.staff{position:absolute;text-align:center;cursor:pointer}
.staff .em{font-size:96px;line-height:1}
.staff .nm{font-family:'Jua';font-size:16px;background:#fff3df;border-radius:8px;padding:1px 8px;display:inline-block}
.say{position:absolute;background:#fff;border-radius:14px;padding:8px 12px;font-size:16px;box-shadow:0 3px 8px rgba(0,0,0,.2);max-width:260px;z-index:12}
.say:after{content:'';position:absolute;bottom:-9px;left:30px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}

/* ---------- kitchen ---------- */
.kitchen-bg{background:linear-gradient(#dfe8e4 0 64%,#8d7a66 64%)}
.kitchen-bg .tiles{position:absolute;left:0;right:0;top:64px;height:400px;background-image:linear-gradient(rgba(255,255,255,.7) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.7) 2px,transparent 2px);background-size:48px 48px}
.kitchen-bg .hood{position:absolute;left:600px;top:64px;width:310px;height:70px;background:linear-gradient(#b9c2c4,#8e989b);clip-path:polygon(15% 0,85% 0,100% 100%,0 100%)}
.station{position:absolute;border-radius:16px;cursor:pointer}
.station.off{cursor:default}
.station .label{left:50%;top:-16px;transform:translateX(-50%)}
.st-knead{left:40px;top:350px;width:270px;height:220px;background:linear-gradient(#e7c79a 0 34%,#a87a4b 34%);box-shadow:0 8px 0 #6f4d2c}
.st-knead:not(.off):hover{filter:brightness(1.06)}
.st-knead .ball{position:absolute;left:85px;top:18px;width:100px;height:62px;border-radius:50%;background:#f7e9ce;box-shadow:inset -6px -6px 0 rgba(0,0,0,.08)}
.st-knead .flour{position:absolute;left:30px;top:30px;width:210px;height:40px;border-radius:50%;background:rgba(255,255,255,.45)}
.st-hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:#fff;font-size:16px}
.st-proof{left:345px;top:180px;width:230px;height:390px;background:linear-gradient(#c9d3d6,#9fadb2);box-shadow:0 8px 0 #6c7a80;cursor:default}
.st-oven{left:610px;top:180px;width:300px;height:390px;background:linear-gradient(#5c5551,#3a3431);box-shadow:0 8px 0 #221d1a;cursor:default}
.st-rack{left:945px;top:250px;width:300px;height:320px;background:transparent;cursor:default;border:8px solid #b4b9bb;border-radius:10px}
.slot{position:absolute;left:16px;right:16px;height:160px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.slot.empty{cursor:default}
.slot .gauge{width:85%}
.slot .stx{font-size:14px;font-weight:bold}
.proof-slot{background:rgba(255,255,255,.5);border:3px solid rgba(255,255,255,.8)}
.proof-slot .dg{border-radius:50% 50% 40% 40%;background:#f7e9ce;box-shadow:inset -5px -6px 0 rgba(0,0,0,.08);transition:width .1s,height .1s}
.oven-slot{background:radial-gradient(#ff9a3c33,#00000055);border:4px solid #8b8480}
.oven-slot.hot{box-shadow:inset 0 0 30px #ff7a1a88}
.oven-slot .stx{color:#ffe1b5}
.loaf{width:110px;height:58px;border-radius:50% 50% 30% 30%/70% 70% 30% 30%;position:relative;box-shadow:inset -6px -6px 0 rgba(0,0,0,.12)}
.loaf .em{position:absolute;right:-14px;top:-12px;font-size:24px}
.smoke{position:absolute;top:-28px;left:30px;font-size:26px;animation:rise 1.4s infinite}
@keyframes rise{from{transform:translateY(6px);opacity:.9}to{transform:translateY(-14px);opacity:0}}
.rack-grid{position:absolute;inset:10px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px}
.rack-slot{border-radius:10px;background:repeating-linear-gradient(90deg,#d5dadc 0 4px,transparent 4px 18px);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer}
.rack-slot.empty{cursor:default}
.rack-slot .be{font-size:58px;line-height:1}
.rack-slot.hotb .be{filter:sepia(1) saturate(3) hue-rotate(-25deg) brightness(.95)}
.rack-slot .steam{position:absolute;top:2px;font-size:24px;animation:rise 1.2s infinite}
.rack-slot.ready{background:repeating-linear-gradient(90deg,#d5dadc 0 4px,transparent 4px 18px),rgba(120,220,120,.35);animation:pulse 1.2s infinite}
.rack-slot .stx{font-size:13px;font-weight:bold;background:rgba(255,255,255,.8);border-radius:6px;padding:0 6px;margin-top:2px}

/* ---------- bakery ---------- */
.bakery-bg{background:linear-gradient(#f6dcb4 0 68%,#a86f42 68%)}
.bakery-bg:before{content:'';position:absolute;left:0;right:0;top:64px;height:425px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.25) 0 30px,transparent 30px 60px)}
.bwin{position:absolute;left:640px;top:90px;width:330px;height:190px;border:12px solid #fff3df;border-radius:10px;background:linear-gradient(#9fd5f3,#e8f6ff);overflow:hidden}
.bwin .street{position:absolute;bottom:0;left:0;right:0;height:50px;background:#c8c0b4}
.bwin .tree{position:absolute;bottom:40px;font-size:60px}
.bdoor{position:absolute;left:1120px;top:120px;width:130px;height:370px;background:#7a4a24;border-radius:60px 60px 0 0;border:8px solid #5a3418}
.bdoor:after{content:'';position:absolute;right:16px;top:180px;width:14px;height:14px;border-radius:50%;background:#ffd36b}
.sign{position:absolute;left:690px;top:300px;font-family:'Jua';font-size:30px;color:#7a4a24}
.shelf{position:absolute;left:36px;top:100px;width:560px;height:460px;background:#c48a55;border:10px solid #8a5a2b;border-radius:14px;padding:46px 14px 14px}
.shelf .label{left:50%;top:-16px;transform:translateX(-50%)}
.shelf-grid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);height:100%;row-gap:0}
.shelf-grid .sitem{border-bottom:10px solid #8a5a2b;display:flex;align-items:flex-end;justify-content:center;position:relative;padding-bottom:6px}
.sitem .se{font-size:60px;line-height:1;cursor:pointer;transition:transform .1s}
.sitem .se:hover{transform:scale(1.15) translateY(-4px)}
.sitem .sg{position:absolute;bottom:6px;right:4px;font-family:'Jua';font-size:15px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.gS{background:#d4a017}.gA{background:#4f9a5c}.gB{background:#4a7fb0}.gC{background:#8a7d6b}.gF{background:#3a3a3a}
.shelf-empty{position:absolute;left:0;right:0;top:200px;text-align:center;color:#fff3df;font-size:20px}
.counter{position:absolute;left:620px;top:470px;width:660px;height:180px;background:linear-gradient(#d39a62 0 18%,#9a6337 18%);border-radius:10px 0 0 0;box-shadow:0 -4px 0 #7a4a24 inset;z-index:8}
.register{position:absolute;left:30px;top:-62px;font-size:64px}
.cust{position:absolute;line-height:1;transition:left .4s}
.cust.at{left:820px;top:262px;font-size:190px;z-index:5}
.cust.q{top:330px;font-size:100px;z-index:4;opacity:.92}
.cust.leave{left:1150px;top:300px;font-size:110px;opacity:.45;z-index:4}
.cust.secret{filter:drop-shadow(0 0 18px #6a3fb5) brightness(.75)}
.bubble{position:absolute;left:625px;top:74px;width:480px;background:#fff;border-radius:18px;padding:12px 16px;box-shadow:0 6px 16px rgba(0,0,0,.2);z-index:10}
.bubble:after{content:'';position:absolute;left:260px;bottom:-16px;border:16px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble.secretb{background:#2e2340;color:#e9dcff}
.bubble.secretb:after{border-top-color:#2e2340}
.bname{font-family:'Jua';font-size:18px}
.bname small{font-family:'Gowun Dodum';font-size:13px;opacity:.7;margin-left:4px}
.bflavor{font-size:16px;margin:6px 0;font-style:italic;color:#6b5040}
.secretb .bflavor{color:#c7b3f0}
.breq{font-size:20px}
.breq .no{font-size:13px;color:#c0392b;margin-left:6px}
.bsay2{font-size:15px;color:#c0392b;margin-top:4px}
.pat{height:7px;background:#eee;border-radius:4px;margin-top:8px;overflow:hidden}
.pat div{height:100%;background:linear-gradient(90deg,#e74c3c,#f1c40f,#2ecc71);background-size:380px 7px}
.leave-say{position:absolute;left:1000px;top:250px;background:#fff;border-radius:14px;padding:6px 12px;font-size:16px;z-index:11;box-shadow:0 3px 8px rgba(0,0,0,.2);max-width:270px}
.counter .sorry{position:absolute;right:30px;top:52px}
.closed{position:absolute;left:760px;top:250px;font-family:'Jua';font-size:34px;color:#7a4a24;background:#fff3df;padding:10px 24px;border-radius:14px;z-index:6}

/* ---------- home ---------- */
.home-bg{background:linear-gradient(#3c3a5c 0 70%,#5b4636 70%)}
.hwin{position:absolute;left:880px;top:100px;width:280px;height:200px;border:12px solid #8a7b6a;border-radius:8px;background:linear-gradient(#141a3a,#2c3566);overflow:hidden}
.hwin .moon{position:absolute;right:40px;top:30px;font-size:60px}
.hwin .st{position:absolute;color:#fff;font-size:12px}
.bed{position:absolute;left:60px;top:400px;width:380px;height:150px;background:#e8d9f0;border-radius:20px 20px 6px 6px;box-shadow:0 10px 0 #7a5a8a}
.bed:before{content:'';position:absolute;left:14px;top:-26px;width:110px;height:50px;background:#fff;border-radius:20px}
.desk{position:absolute;left:880px;top:420px;width:300px;height:20px;background:#8a6240}
.desk .lap{position:absolute;left:100px;top:-70px;font-size:70px}
.lamp{position:absolute;left:470px;top:330px;font-size:70px}
.home-panel{position:absolute;left:190px;top:110px;width:900px;background:rgba(255,247,234,.97);border-radius:22px;padding:24px 28px;box-shadow:0 12px 40px rgba(0,0,0,.4);z-index:5}
.home-panel h2{font-size:30px;margin-bottom:4px}
.home-panel p.sub{margin-bottom:16px;color:#6b5040}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:#fff;border:3px solid #e9cfa9;border-radius:16px;padding:14px 12px;text-align:center;cursor:pointer;transition:transform .12s}
.card:hover{transform:translateY(-6px);border-color:var(--accent)}
.card.disabled{opacity:.45;cursor:not-allowed;transform:none}
.card .ic{font-size:54px}
.card h3{font-size:22px;margin:4px 0}
.card .cost{font-family:'Jua';color:var(--accent);font-size:18px}
.card .ds{font-size:14px;color:#6b5040;margin-top:6px;min-height:40px}
.result{font-size:20px;line-height:1.6;margin:10px 0 20px}

/* ---------- settle / ending / quit ---------- */
.paper-bg{background:radial-gradient(circle,#4a3424,#1d150f)}
.receipt{position:absolute;left:50%;top:96px;transform:translateX(-50%);width:460px;background:#fffdf7;padding:26px 30px;border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.5);font-size:18px}
.receipt h2{text-align:center;font-size:30px}
.receipt .rsub{text-align:center;color:#8a7d6b;margin-bottom:12px}
.receipt .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #d8cbb8}
.receipt .row.total{font-family:'Jua';font-size:24px;border:none;border-top:2px solid #3b2a1a;margin-top:8px;padding-top:10px}
.receipt .btn{width:100%;margin-top:18px}
.ending{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,#3a2b4f,#120c18);color:#f3eaff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:0 160px}
.ending h1{font-size:54px}
.ending p{font-size:20px;line-height:1.7}
.ending .card-note{background:#2e2340;border:2px solid #7d5cc4;border-radius:12px;padding:14px 22px;font-size:20px;color:#e9dcff}
.ending .stats{opacity:.8;font-size:17px}
.quit{position:absolute;inset:0;background:#120c08;color:#fff3df;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;font-size:26px}

/* ---------- overlay ---------- */
#overlay{position:absolute;inset:0;z-index:40}
#overlay:empty{display:none}
.dim{position:absolute;inset:0;background:rgba(20,12,6,.55)}
.dim.light{background:rgba(20,12,6,.25)}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--cream);border-radius:22px;padding:24px 30px;box-shadow:0 14px 40px rgba(0,0,0,.45);text-align:center}
.panel h2{font-size:30px;margin-bottom:14px}
.picker-grid{display:grid;grid-template-columns:repeat(4,150px);gap:14px;margin-bottom:16px}
.pk{background:#fff;border:3px solid #e9cfa9;border-radius:14px;padding:12px;cursor:pointer}
.pk:hover{border-color:var(--accent);transform:translateY(-4px)}
.pk .ic{font-size:56px}
.pk b{font-family:'Jua';font-size:20px;font-weight:400;display:block}
.pk span{font-size:15px;color:#8a5a2b}
.knead-panel{width:620px}
.kdough{margin:6px auto 18px;width:220px;height:110px;border-radius:50%;background:#f7e9ce;box-shadow:inset -10px -10px 0 rgba(0,0,0,.08),0 6px 0 #c9a77c}
.kdough.squish{animation:squish .25s}
@keyframes squish{50%{transform:scale(1.25,.7)}}
.kbar{position:relative;height:38px;background:#e6d4ba;border-radius:20px;overflow:hidden;margin:0 10px}
.kzone{position:absolute;top:0;bottom:0;background:#7fcf86}
.kzone:after{content:'';position:absolute;left:50%;top:0;bottom:0;width:3px;background:#3e8e48;transform:translateX(-50%)}
.kmarker{position:absolute;top:-2px;bottom:-2px;width:8px;margin-left:-4px;background:#c0392b;border-radius:4px;box-shadow:0 0 0 2px #fff}
.kdots{display:flex;justify-content:center;gap:14px;margin:16px 0 6px}
.kdots span{width:54px;height:36px;border-radius:10px;background:#e6d4ba;display:flex;align-items:center;justify-content:center;font-family:'Jua';font-size:18px}
.kdots span.on{background:var(--green);color:#fff}
.kfb{min-height:30px;font-size:20px;margin-bottom:12px;font-family:'Jua'}
.dialog{position:absolute;left:40px;right:40px;bottom:24px;min-height:170px;background:rgba(255,247,234,.98);border:4px solid #8a5a2b;border-radius:22px;padding:20px 26px;display:flex;gap:22px;align-items:flex-start;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.dialog.narr{background:rgba(38,26,16,.95);color:#fff3df;border-color:#c9a77c}
.portrait{width:120px;height:120px;border-radius:18px;background:#f1dcbc;display:flex;align-items:center;justify-content:center;flex:none}
.portrait .pe{font-size:90px;line-height:1}
.dtext{flex:1}
.dname{font-size:24px;color:var(--accent);margin-bottom:6px}
.dline{font-size:22px;line-height:1.6;animation:fadein .35s}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}}
.dnext{text-align:right;font-size:14px;opacity:.6;margin-top:8px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.15}}
.choices{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}

/* ---------- modal / toast / fade ---------- */
.modal{position:absolute;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(10,6,3,.6)}
.modal.hidden{display:none}
.modal .mpanel{background:var(--cream);border-radius:22px;padding:26px 34px;width:400px;display:flex;flex-direction:column;gap:14px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.modal h2{text-align:center;font-size:30px}
.modal .btn{width:100%}
.vrow{display:flex;align-items:center;gap:12px;font-size:18px;background:#fff;border-radius:12px;padding:10px 14px}
.vrow input{flex:1;accent-color:var(--accent)}
.vrow span{width:40px;text-align:right;font-family:'Jua'}
.modal p{font-size:19px;text-align:center;white-space:pre-line;line-height:1.6}
.mrow{display:flex;gap:12px}

function storeSet(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
function storeGet(k){ try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch(e){ return null; } }
function canSave(){ return S && ['game','settle','home'].includes(ui.screen); }
function saveGame(){
  if(!canSave()) return false;
  S.screen = ui.screen;
  const ok = storeSet(SAVE_KEY, S);
  toast(ok ? '💾 저장했어요' : '저장에 실패했어요 (브라우저 저장소를 사용할 수 없음)');

}
function loadGame(){
  const d = storeGet(SAVE_KEY);

/* ---------------- 오디오 (WebAudio로 생성) ---------------- */
const Snd = {
  ctx:null, master:null, music:null, vol:0.6, muted:false, kind:null, step:0, timer:null,
  init(){
    if(this.ctx) { if(this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
      this.music = this.ctx.createGain(); this.music.gain.value = 0.5; this.music.connect(this.master);
      this.apply();
      this.timer = setInterval(() => this.tick(), 260);
    } catch(e){ this.ctx = null; }
  },
  apply(){ if(this.master) this.master.gain.value = this.muted ? 0 : this.vol; },
  tone(f, dur, type='sine', v=0.2, delay=0, dest){
    if(!this.ctx) return;
    const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t+0.015); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(dest || this.master); o.start(t); o.stop(t+dur+0.05);
  },
  sfx(n){
    const T = (...a) => this.tone(...a);
    switch(n){
      case 'click': T(700,.06,'square',.04); break;
      case 'good':  T(660,.12,'triangle',.18); T(990,.18,'triangle',.18,.08); break;
      case 'great': T(660,.1,'triangle',.18); T(880,.1,'triangle',.18,.07); T(1320,.25,'triangle',.18,.14); break;
      case 'bad':   T(180,.25,'sawtooth',.08); break;
      case 'cash':  T(1300,.08,'square',.06); T(1750,.22,'triangle',.15,.07); break;
      case 'bell':  T(880,.5,'sine',.2); T(1320,.6,'sine',.12,.12); break;
      case 'door':  T(520,.15,'sine',.15); T(780,.3,'sine',.15,.1); break;
      case 'ding':  T(1568,.6,'sine',.15); break;
      case 'knead': T(140,.12,'sine',.25); break;
    }
  },
  setBgm(k){ if(this.kind !== k){ this.kind = k; this.step = 0; } },
  PAT: {
    title:   { base:262, n:[0,4,7,12,null,7,4,null, 5,9,12,9,7,null,4,2] },
    kitchen: { base:294, n:[0,null,7,null,4,null,7,9, 7,null,4,null,2,null,4,null] },
    bakery:  { base:349, n:[0,4,7,4,9,7,4,null, 2,5,9,5,7,null,null,null] },
    home:    { base:220, n:[0,null,null,3,null,null,7,null, 5,null,null,3,null,null,2,null] },
    ending:  { base:196, n:[0,null,3,null,7,null,10,null, 8,null,7,null,3,null,null,null] },
  },
  tick(){
    if(!this.ctx || !this.kind || (ui.settings && false)) return;
    const P = this.PAT[this.kind]; if(!P) return;
    const n = P.n[this.step % P.n.length];
    if(n != null) this.tone(P.base * Math.pow(2, n/12), .32, 'triangle', .09, 0, this.music);
    if(this.step % 8 === 0) this.tone(P.base/2, .6, 'sine', .1, 0, this.music);
    this.step++;
  },
};
function sfx(n){ Snd.sfx(n); }

function gauge(v, max, lo, hi){
  return `<div class="gauge"><div class="band" style="left:${lo/max*100}%;width:${(hi-lo)/max*100}%"></div><div class="fill" style="width:${clamp(v/max,0,1)*100}%"></div></div>`;
}
function ovenColor(b){
  const st = [[0,[244,228,190]],[0.6,[236,200,128]],[0.95,[214,140,60]],[1.15,[140,74,30]],[1.45,[38,26,18]]];
  for(let i=1;i<st.length;i++){
    if(b <= st[i][0]){ const [a0,c0] = st[i-1], [a1,c1] = st[i], t = (b-a0)/(a1-a0);
      return `rgb(${c0.map((v,j) => Math.round(v+(c1[j]-v)*t)).join(',')})`; }
  }
  return 'rgb(38,26,18)';
}

    <button class="btn big ${k.done ? 'disabled' : ''}" data-act="khit">반죽! (Space)</button></div>`;
}
function dialogHTML(){
  const d = ui.dialog, c = CHARS[d.who] || {};
  const portrait = d.who === 'me' ? doughAvatar(100, S.damage) : d.who === 'narr' ? '' : `<span class="pe emoji">${c.em}</span>`;
  const adv = d.choice ? '' : 'data-act="next"';
  return `<div class="dim light" ${adv}></div><div class="dialog ${d.who === 'narr' ? 'narr' : ''}" ${adv}>
    ${portrait ? `<div class="portrait">${portrait}</div>` : ''}<div class="dtext">${c.name ? `<div class="dname">${c.name}</div>` : ''}<div class="dline">${d.text}</div>
    ${d.choice ? `<div class="choices">${d.choice.map((o,i) => `<button class="btn" data-act="choose" data-arg="${i}">${o.t}</button>`).join('')}</div>` : '<div class="dnext">▼ 클릭 / Space</div>'}</div></div>`;
}

/* ---------------- 스토리 엔진 ---------------- */
function startStory(key){ S.story = { key, idx:0, ret:null }; showLine(); }
function showLine(){
  while(S.story){
    const st = S.story, ln = STORIES[st.key][st.idx];
    if(!ln){
      if(st.ret){ S.story = st.ret; continue; }
      const k = st.key; S.story = null; ui.dialog = null; renderOverlay(); onStoryEnd(k); return;
    }
    if(ln.cond && !COND[ln.cond]()){ st.idx++; continue; }
    ui.dialog = ln; renderOverlay(); return;
  }
}
function nextLine(){ if(!S.story || (ui.dialog && ui.dialog.choice)) return; sfx('click'); S.story.idx++; showLine(); }
function choose(i){
  const o = ui.dialog.choice[i];
  if(o.aff) for(const k in o.aff) S.affinity[k] += o.aff[k];
  if(o.set) S.flags[o.set] = true;
  sfx('good');
  S.story.idx++;
  if(o.go) S.story = { key:o.go, idx:0, ret:S.story };
  showLine();
}
function onStoryEnd(key){
  if(key.startsWith('break')) advancePhase();
  renderAll();
}

/* ---------------- 진행 ---------------- */
function newGame(){
  S = newState(); ui.screen = 'game'; ui.knead = null; ui.picker = false; ui.dialog = null;
  showFade('1일차', '새벽 05:00 · 주방', () => startStory('morning1'));
}
function onTimeUp(ph){
  sfx('bell');
  const msg = { bake1:'⏰ 08:00 — 빵집 오픈 시간이에요!', sale1:'⏰ 11:00 — 오전 영업 끝! 쉬는 시간이에요.', bake2:'⏰ 15:00 — 오후 영업 시간이에요!', sale2:'⏰ 18:00 — 퇴근 시간이에요!' };
  toast(msg[ph.id]);
}
function tryMove(){
  if(!S.timeUp) return;
  const ph = PHASES[S.phaseIdx];
  if(ph.loc === 'kitchen'){
    const n = S.proofer.filter(Boolean).length + S.oven.filter(Boolean).length;
    if(n){ confirmBox(`발효실·오븐에 반죽 ${n}판이 남아 있어요.\n지금 나가면 버려집니다. 나갈까요?\n(식힘대의 빵은 크루가 진열대로 옮겨줘요)`, advancePhase); return; }
  } else {
    const n = S.customers.filter(c => c.state !== 'leaving').length;
    if(n){ confirmBox(`아직 손님 ${n}명이 기다리고 있어요.\n그래도 이동할까요?`, advancePhase); return; }
  }
  advancePhase();
}
function advancePhase(){
  const ph = PHASES[S.phaseIdx];
  if(ph.id.startsWith('bake')){
    S.today.lost += (S.proofer.filter(Boolean).length + S.oven.filter(Boolean).length) * BATCH;
    S.rack.forEach(it => { if(it) for(let i=0;i<BATCH;i++) if(S.shelf.length < SHELF_MAX) S.shelf.push(makeBread(it)); });
    S.proofer = [null,null]; S.oven = [null,null]; S.rack = [null,null,null,null];
  }
  if(ph.id.startsWith('sale')){ S.today.missed += S.customers.filter(c => c.state !== 'leaving').length; S.customers = []; }
  ui.knead = null; ui.picker = false;
  if(S.phaseIdx === PHASES.length - 1){ goSettle(); return; }
  S.phaseIdx++;
  const np = PHASES[S.phaseIdx];
  S.minute = np.start; S.timeUp = false; S.location = np.loc; S.spawnTimer = 2; S.speed = 1;
  sfx('door');
  const sub = { sale1:'08:00 · 빵집 오픈', break:'11:00 · 주방 · 쉬는 시간', bake2:'13:00 · 오후 빵 만들기', sale2:'15:00 · 오후 영업' }[np.id];
  showFade(np.loc === 'kitchen' ? '🍳 주방' : '🥐 빵집', sub, () => { if(np.id === 'break') startStory('break' + S.day); });
}
function goSettle(){
  S.today.discarded = S.shelf.length; S.shelf = [];
  sfx('door');
  showFade('🌙 퇴근', `${S.day}일차 18:00`, () => { ui.screen = 'settle'; });
}
function goHome(){ showFade('🏠 집', '19:00 · 퇴근 후', () => { ui.screen = 'home'; }); }
function takeReward(id){
  const r = REWARDS.find(x => x.id === id);
  if(S.money < r.cost){ toast('돈이 부족해요'); sfx('bad'); return; }
  S.money -= r.cost;
  S.stamina = clamp(S.stamina + r.st, 0, 100);
  S.damage = clamp(S.damage + r.dmg, 0, 100);
  S.mood = clamp(S.mood + r.mood, 0, 100);
  S.night = id; sfx('great'); renderAll();
}
function sleep(){
  if(S.day >= 2){ showFade('…', '', () => { ui.screen = 'ending'; S.screen = 'ending'; storeSet(SAVE_KEY, S); }); return; }
  showFade(`${S.day + 1}일차`, '새벽 05:00 · 주방', () => {
    S.day++; Object.assign(S, dayReset()); ui.screen = 'game';
    startStory('morning' + S.day);
  });
}

/* ---------------- 주방 미니게임 ---------------- */
const proofScore = p => clamp(100 - Math.abs(p - .85)*220, 0, 100);
const bakeScore  = b => clamp(100 - Math.abs(b - .95)*250, 0, 100);
const word = s => s >= 90 ? '완벽!' : s >= 70 ? '좋아요' : s >= 45 ? '그럭저럭' : '아쉬워요';
function makeBread(it){ return { type:it.type, q:it.q, g:gradeOf(it.q).g }; }

function openPicker(){
  const ph = PHASES[S.phaseIdx];
  if(!ph.id.startsWith('bake')) return;
  if(S.timeUp){ toast('영업 시간이에요! 진행 중인 빵만 마무리하세요.'); sfx('bad'); return; }
  if(!S.proofer.some(x => !x)){ toast('발효실이 꽉 찼어요! 발효된 반죽을 먼저 오븐에 넣으세요.'); sfx('bad'); return; }
  if(S.stamina < 6){ toast('너무 지쳤어요… (체력 부족)'); sfx('bad'); return; }
  ui.picker = true; sfx('click'); renderOverlay();
}
function startKnead(type){
  ui.picker = false;
  S.stamina = clamp(S.stamina - 6, 0, 100);
  S.damage = clamp(S.damage + 1, 0, 100);
  const w = S.stamina < 30 ? .12 : .18;
  ui.knead = { type, pos:0, dir:1, speed: .85 + S.damage/100*.7, w, zc: rand(.25,.75), hits:[], done:false, t:0, fb:'', squish:false };
  renderOverlay();
}
function updateKnead(dt){
  const k = ui.knead;
  if(k.done){ k.t -= dt; if(k.t <= 0) finishKnead(); return; }
  k.pos += k.dir * k.speed * dt;
  if(k.pos > 1){ k.pos = 1; k.dir = -1; } if(k.pos < 0){ k.pos = 0; k.dir = 1; }
  const m = document.getElementById('kmarker'); if(m) m.style.left = (k.pos*100) + '%';
}
function kneadHit(){
  const k = ui.knead; if(!k || k.done) return;
  const d = Math.abs(k.pos - k.zc), half = k.w/2;
  const s = d <= half ? 100 - (d/half)*25 : Math.max(0, 60 - (d-half)*300);
  k.hits.push(s); k.fb = word(s); k.squish = true;
  sfx('knead'); if(s >= 75) sfx('good'); else if(s < 45) sfx('bad');
  if(k.hits.length >= 3){
    k.done = true; k.t = 1.0;
    const avg = k.hits.reduce((a,b) => a+b, 0) / 3; k.score = avg;
    k.fb = `반죽 완성! 점수 ${Math.round(avg)} — ${word(avg)}`;
  } else k.zc = rand(.2,.8);
  renderOverlay();
  setTimeout(() => { if(ui.knead) ui.knead.squish = false; }, 260);
}
function finishKnead(){
  const k = ui.knead; ui.knead = null;
  const i = S.proofer.findIndex(x => !x);
  if(i < 0){ toast('발효실에 자리가 없어 반죽을 버렸어요…'); S.today.lost += BATCH; renderOverlay(); return; }
  S.proofer[i] = { type:k.type, k:k.score, p:0 };
  toast(`${BREADS[k.type].emoji} 반죽을 발효실에 넣었어요`);
  renderOverlay();
}
function clickProof(i){
  const it = S.proofer[i]; if(!it) return;
  const j = S.oven.findIndex(x => !x);
  if(j < 0){ toast('오븐이 꽉 찼어요! 오븐의 빵을 먼저 꺼내세요.'); sfx('bad'); return; }
  const ps = proofScore(it.p);
  S.oven[j] = { type:it.type, k:it.k, ps, b:0, dinged:false, warned:false };
  S.proofer[i] = null;
  toast(`발효 ${word(ps)} (${Math.round(ps)}) → 오븐으로!`); sfx(ps >= 70 ? 'good' : 'click');
}
function clickOven(i){
  const it = S.oven[i]; if(!it) return;
  const j = S.rack.findIndex(x => !x);
  if(j < 0){ toast('식힘대가 꽉 찼어요! 다 식은 빵을 진열대로 옮기세요.'); sfx('bad'); return; }
  const bs = bakeScore(it.b);
  const q = Math.round((it.k + it.ps + bs) / 3);
  S.rack[j] = { type:it.type, q, c:0 };
  S.oven[i] = null;
  S.damage = clamp(S.damage + (it.b > 1.25 ? 6 : 3), 0, 100);   // 오븐 열기
  S.today.made += BATCH;
  const g = gradeOf(q).g;
  toast(`굽기 ${word(bs)} (${Math.round(bs)}) → 빵 완성! 등급 ${g}`); sfx(g === 'S' || g === 'A' ? 'great' : 'good');
  if(S.damage >= 30 && !S.flags.heatHint){ S.flags.heatHint = true; setTimeout(() => toast('🔥 오븐 열기에 손끝이 조금 바삭해진 것 같다…'), 900); }
}
function clickRack(i){
  const it = S.rack[i]; if(!it) return;
  if(it.c < 1){ toast('아직 뜨거워요! 김이 다 빠질 때까지 기다리세요.'); sfx('bad'); return; }
  if(S.shelf.length + BATCH > SHELF_MAX){ toast('진열대가 꽉 찼어요!'); sfx('bad'); return; }
  for(let n=0;n<BATCH;n++) S.shelf.push(makeBread(it));
  S.rack[i] = null; toast(`${BREADS[it.type].emoji} ${BATCH}개를 진열대로 옮겼어요`); sfx('cash');
}

/* ---------------- 손님 ---------------- */
function spawnCustomer(){
  let p; do { p = Math.floor(Math.random()*PROFILES.length); } while(p === S.lastProfile);
  S.lastProfile = p;
  const types = Object.keys(BREADS);
  const want = (S.shelf.length && Math.random() < .75) ? pick(S.shelf).type : pick(types);
  const tier = S.damage >= 60 ? 2 : (S.damage >= 30 || S.day >= 2) ? 1 : 0;
  const pool = Math.random() < .6 ? FLAVOR[tier] : FLAVOR[Math.max(0, tier-1)];
  S.customers.push({ id:++S.cid, p, want, line:pick(pool), pat:1, maxT:20, state:'wait', say:'', say2:'', lt:0 });
  sfx('door');
}
function spawnSecret(){
  const d2 = S.day >= 2;
  S.customers.push({ id:++S.cid, secret:true, p:-1, want:'toast', pat:1, maxT:30, state:'wait', say:'', say2:'', lt:0,
    line: d2 ? (S.damage >= 30 ? '또 보는군. 어제보다 노릇해졌어.' : '아직 말랑하군. 다행이야.') : '……',
    req: d2 ? '오늘도 아무 빵이나. 당신이 만든 걸로.' : '아무 빵이나 하나. 당신이 만든 걸로.' });
  sfx('ding');
}
function counterCustomer(){ return S.customers.find(c => c.state !== 'leaving'); }
function leave(c, say, secs=1.6){ c.state = 'leaving'; c.say = say; c.lt = secs; }
function secretLeave(c, served){
  if(S.day >= 2){ S.flags.secret2 = true; leave(c, served ? '…곧 다시 보지.' : '빵은 됐소. 이건 두고 가지.', 2.4); setTimeout(() => toast('🃏 검은 모자의 손님이 카운터에 카드를 두고 갔다…'), 600); }
  else { S.flags.secret1 = true; leave(c, '…좋은 반죽이군. 아직은.', 2.4); }
}
function giveBread(i){
  const c = counterCustomer(), b = S.shelf[i];
  if(!b) return;
  if(!c){ toast('카운터에 손님이 없어요'); return; }
  if(!c.secret && b.type !== c.want){
    c.pat -= .2; c.say2 = `어… 제가 찾는 건 ${BREADS[c.want].name}인데요.`; sfx('bad'); return;
  }
  S.shelf.splice(i, 1);
  const G = GRADES.find(x => x.g === b.g);
  const price = Math.round(BREADS[b.type].price * G.m / 100) * 100;
  const tip = S.mood >= 70 ? 300 : 0;
  S.money += price + tip; S.today.revenue += price + tip; S.today.tips += tip; S.total += price + tip; S.today.sold++;
  S.stamina = clamp(S.stamina - 1, 0, 100);
  sfx('cash');
  if(c.secret){ secretLeave(c, true); return; }
  const gl = b.g === 'S' ? '와, 이거 정말 맛있어 보여요!' : b.g === 'F' ? '…좀 탔네요? 그래도 살게요.' : pick(THANKS);
  leave(c, `${gl} (+${fmtMoney(price + tip)})`);
  if(b.g === 'S') S.mood = clamp(S.mood + 2, 0, 100);
}
function sorry(){
  const c = counterCustomer(); if(!c) return;
  if(c.secret){ secretLeave(c, false); return; }
  S.mood = clamp(S.mood - 1, 0, 100); S.today.missed++;
  leave(c, '아, 그럼 다음에 올게요.'); sfx('click');
}

/* ---------------- 업데이트 루프 ---------------- */
function update(dt){
  const ph = PHASES[S.phaseIdx];
  if(ph.id !== 'break' && !S.timeUp){
    S.minute += dt * S.speed / SEC_PER_MIN;
    if(S.minute >= ph.end){ S.minute = ph.end; S.timeUp = true; onTimeUp(ph); }
  }
  if(S.location === 'kitchen'){
    S.proofer.forEach(it => { if(it) it.p = Math.min(PROOF_MAX + .1, it.p + dt/PROOF_TIME); });
    S.oven.forEach(it => { if(!it) return;
      it.b = Math.min(BAKE_MAX + .05, it.b + dt/BAKE_TIME);
      if(!it.dinged && it.b >= .9){ it.dinged = true; sfx('ding'); }
      if(!it.warned && it.b >= 1.2){ it.warned = true; toast('🔥 타는 냄새가 나요!'); }
    });
    S.rack.forEach(it => { if(it) it.c = Math.min(1, it.c + dt/COOL_TIME); });
  } else {
    if(!S.timeUp){
      S.spawnTimer -= dt;
      if(S.spawnTimer <= 0){
        if(S.customers.filter(c => c.state !== 'leaving').length < 4) spawnCustomer();
        S.spawnTimer = S.day >= 2 ? rand(5,8) : rand(6,10);
      }
      if(ph.id === 'sale2' && !S.secretDone && S.minute >= 960){ S.secretDone = true; spawnSecret(); }
    }
    let first = true;
    S.customers.forEach(c => {
      if(c.state === 'leaving'){ c.lt -= dt; return; }
      c.pat -= dt / (first ? c.maxT : c.maxT*3); first = false;
      if(c.pat <= 0){
        if(c.secret) secretLeave(c, false);
        else { leave(c, pick(SAD)); S.mood = clamp(S.mood - 3, 0, 100); S.today.missed++; sfx('bad'); }
      }
    });
    S.customers = S.customers.filter(c => c.state !== 'leaving' || c.lt > 0);
  }
}
let last = performance.now(), acc = 0;
function frame(t){
  const dt = Math.min(.1, (t - last)/1000); last = t;
  const running = S && ui.screen === 'game' && !ui.settings && !ui.fading && !ui.dialog && $('#confirm').classList.contains('hidden');
  if(running) update(dt);
  if(running && ui.knead) updateKnead(dt);
  if(ui.staffSay){ ui.staffSay.t -= dt; if(ui.staffSay.t <= 0) ui.staffSay = null; }
  acc += dt;
  if(acc >= .1){ acc = 0; if(S && ui.screen === 'game'){ renderHUD(); renderScreen(); } }
  requestAnimationFrame(frame);
}

/* ---------------- 입력 ---------------- */
function act(a, arg){
  switch(a){
    case 'new':
      if(storeGet(SAVE_KEY)) confirmBox('저장된 게임이 있어요.\n새로 시작하면 저장 데이터를 덮어쓰게 돼요.\n(저장하기 전까지는 기존 데이터가 유지돼요)', newGame);
      else newGame();
      break;
    case 'continue': loadGame(); break;
    case 'exit': ui.screen = 'quit'; renderAll(); try { window.close(); } catch(e){} break;
    case 'toTitle': ui.screen = 'title'; S = null; ui.dialog = null; ui.knead = null; renderAll(); break;
    case 'knead': openPicker(); break;
    case 'pick': startKnead(arg); break;
    case 'pickCancel': ui.picker = false; renderOverlay(); break;
    case 'khit': kneadHit(); break;
    case 'proof': clickProof(+arg); break;
    case 'oven': clickOven(+arg); break;
    case 'rack': clickRack(+arg); break;
    case 'give': giveBread(+arg); break;
    case 'sorry': sorry(); break;
    case 'staff': if(!ui.dialog){ ui.staffSay = { who:arg, text:pick(STAFF_TALK[arg]), t:2.6 }; sfx('click'); } break;
    case 'speed': S.speed = S.speed === 1 ? 3 : 1; sfx('click'); break;
    case 'skip': if(!S.timeUp) confirmBox(`${fmtTime(PHASES[S.phaseIdx].end)}까지 시간을 건너뛸까요?`, () => { S.minute = PHASES[S.phaseIdx].end - .01; }); break;
    case 'move': tryMove(); break;
    case 'next': nextLine(); return;
    case 'choose': choose(+arg); return;
    case 'goHome': goHome(); break;
    case 'reward': takeReward(arg); return;
    case 'sleep': sleep(); return;
  }
  if(S && ui.screen === 'game'){ renderHUD(); renderScreen(); }
}
function onPointer(e){
  Snd.init();
  const el = e.target.closest('[data-act]');
  if(!el || el.classList.contains('disabled')) return;
  if(ui.fading) return;
  act(el.dataset.act, el.dataset.arg);
}
$('#screen').addEventListener('pointerdown', onPointer);
$('#overlay').addEventListener('pointerdown', onPointer);
document.addEventListener('keydown', e => {
  if(e.code === 'Escape'){ ui.settings ? closeSettings() : openSettings(); return; }
  if(ui.settings) return;
  if(e.code === 'Space' || e.code === 'Enter'){
    e.preventDefault(); Snd.init();
    if(ui.knead && !ui.fading) kneadHit();
    else if(ui.dialog && !ui.fading) nextLine();
  }
});
